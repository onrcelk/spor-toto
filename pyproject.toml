[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sportoto"
version = "0.1.0"
description = "1/X/2 and over/under match prediction with auditable storage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Onur Celik"}]
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
